name: portfolio

services:
  app:
    image: portfolio-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: portfolio-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      web-proxy:
        aliases:
          - portfolio-app
      database:

  migrate:
    image: portfolio-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      database:
    restart: "no"

networks:
  web-proxy:
    external: true
    name: web-proxy
  database:
    external: true
    name: nazishop_default
